name: Generate integration brand icons (temporary branch-only)

on:
  push:
    branches: [fix/manual-tv-pairing-brand-icon]
    paths:
      - '.github/workflows/prepare-brand-icons.yml'
      - 'custom_components/kellies_voice/brand/icon.svg'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-tv-pairing-brand-icon
      - name: Render PNG from original copper SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import io, cairosvg
          from PIL import Image
          base = Path("custom_components/kellies_voice/brand")
          for px, filename in ((256, "icon.png"), (512, "icon@2x.png")):
              raw = cairosvg.svg2png(url=str(base/"icon.svg"), output_width=px, output_height=px)
              image = Image.open(io.BytesIO(raw)).convert("RGB")
              image.quantize(colors=64, method=Image.Quantize.FASTOCTREE).save(base/filename, optimize=True)
          PY
      - name: Commit required PNG assets to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kellies_voice/brand/icon.png custom_components/kellies_voice/brand/icon@2x.png
          if ! git diff --cached --quiet; then
            git commit -m "Render 256px and 512px integration brand icons"
            git push origin HEAD:fix/manual-tv-pairing-brand-icon
          fi
