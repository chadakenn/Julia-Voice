announce:
  fields:
    title:
      required: true
      example: Washer
      selector:
        text:
    text:
      required: true
      example: The washer is done.
      selector:
        text:
          multiline: true
    duration_seconds:
      example: 10
      selector:
        number:
          min: 4
          max: 45
          mode: box
    device_id:
      example: ""
      selector:
        text:
show_camera:
  fields:
    entity_id:
      required: true
      example: camera.front_door
      selector:
        entity:
          filter:
            domain: camera
    title:
      required: true
      example: Front door
      selector:
        text:
    duration_seconds:
      example: 20
      selector:
        number:
          min: 4
          max: 45
          mode: box
    device_id:
      example: ""
      selector:
        text:
show_live_camera:
  fields:
    entity_id:
      required: true
      example: camera.driveway
      selector:
        entity:
          filter:
            domain: camera
    title:
      example: Live driveway
      selector:
        text:
    duration_seconds:
      example: 90
      selector:
        number:
          min: 15
          max: 180
          mode: box
    device_id:
      example: ""
      selector:
        text:

hide_camera:
  fields:
    device_id:
      example: ""
      selector:
        text:

show_forecast:
  fields:
    entity_id:
      example: weather.forecast_home
      selector:
        entity:
          filter:
            domain: weather
    duration_seconds:
      example: 20
      selector:
        number:
          min: 8
          max: 45
          mode: box
    device_id:
      example: ""
      selector:
        text:
