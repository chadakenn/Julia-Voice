plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvvoiceprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.tvvoiceprobe'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10-kellies-voice-brand'
    }

    // The keystore is private and supplied from GitHub Actions secrets.
    // Never put the signing key or password into this public repository.
    signingConfigs {
        release {
            def keyPath = System.getenv('TV_SIGNING_KEYSTORE_PATH')
            def keyPasswordValue = System.getenv('TV_SIGNING_PASSWORD')
            if (keyPath && keyPasswordValue) {
                storeFile file(keyPath)
                storePassword keyPasswordValue
                keyAlias 'tvvoice'
                keyPassword keyPasswordValue
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
}
